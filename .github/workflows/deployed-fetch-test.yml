name: Test deployed fetch endpoint
on:
  push:
    paths:
      - .github/workflows/deployed-fetch-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Test authenticated fetch on the deployed server
        env:
          API_KEY: ${{ secrets.TEMP_FETCH_TEST_KEY }}
          ENDPOINT: http://opal.coffaie.online:4011/fetch
        run: |
          set -eu
          if [ -z "$API_KEY" ]; then
            echo 'Add the TEMP_FETCH_TEST_KEY Actions secret, then rerun this workflow.' >&2
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 40 --output /tmp/fetch-body --write-out '%{http_code}' --get \
            --header "x-api-key: $API_KEY" --data-urlencode 'url=https://example.com/' "$ENDPOINT")
          echo "Fetch HTTP status: $status"
          if [ "$status" != 200 ]; then
            echo 'Fetch did not return HTTP 200. Response body (up to 500 bytes):'
            head -c 500 /tmp/fetch-body
            echo
            exit 1
          fi
          if ! grep -qi 'example domain' /tmp/fetch-body; then
            echo 'Unexpected response body.' >&2
            exit 1
          fi
          echo 'Fetch successfully returned the example.com page.'
